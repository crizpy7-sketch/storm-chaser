name: Verify

# Run gameplay, rendered transparency, and release-tooling regressions on main
# and pull requests.
on:
  # Branch pushes are covered by pull_request once a PR is open, so push is
  # limited to the default branch; otherwise every commit runs the suite twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Release tooling (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release packaging
        run: python -B tools/test_package_release.py
      - name: Check suite runner
        if: runner.os == 'Linux'
        run: bash tools/test_run_suites.sh

  suites:
    name: Godot check suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.5.1-stable
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p $HOME/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sSfL --retry 3 -o /tmp/godot.zip "$url"
          unzip -q -o /tmp/godot.zip -d $HOME/godot
          chmod +x $HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64

      - name: Import project
        run: |
          set -uo pipefail
          # First import always reports missing optional media; the suites skip
          # those checks rather than fail, so a non-zero status here is not fatal.
          $HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --import || true

      - name: Run check suites
        run: GODOT=$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64 tools/run_suites.sh

      - name: Check tornado transparency
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          timeout 60 xvfb-run -a "$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64" --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://tools/check_storm_render.gd > .suite-logs/check_storm_render.log 2>&1
          cat .suite-logs/check_storm_render.log
          grep -q 'STORM_RENDER_TESTS 4 checks; 0 failures' .suite-logs/check_storm_render.log
          ! grep -qE 'SCRIPT ERROR|Parse Error' .suite-logs/check_storm_render.log

      - name: Upload suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs
          path: .suite-logs/
          retention-days: 14
          # .suite-logs is a dotfile; without this the upload silently finds nothing.
          include-hidden-files: true
